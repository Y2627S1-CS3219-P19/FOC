# Serves the built web app only. API routing lives in gateway/nginx.conf.
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 'ok'; }

  # Single-page app: unknown paths load index.html and React Router takes over.
  location / { try_files $uri /index.html; }
}
