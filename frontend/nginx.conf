# Serves the built web app and acts as the local API gateway, so the browser only talks to one origin.
server {
  listen 80;
  root /usr/share/nginx/html;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Service-to-service endpoints are never reachable from the browser (F6.4).
  location /v1/internal/ { return 404; }

  location /v1/suppliers { proxy_pass http://supplier-service:3002; }
  location /v1/supplier-images/ { proxy_pass http://supplier-service:3002; }
  location /v1/ { proxy_pass http://user-service:3001; }

  # Single-page app: unknown paths load index.html and React Router takes over.
  location / { try_files $uri /index.html; }
}
