# Local API gateway, so the browser only talks to one origin. The web app itself is served by the frontend container.
server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /healthz { access_log off; return 200 'ok'; }

  # Service-to-service endpoints are never reachable from the browser (F6.4).
  location /v1/internal/ { return 404; }

  location /v1/credits { proxy_pass http://credit-service:3003; }
  location /v1/admin/credits { proxy_pass http://credit-service:3003; }
  location /v1/orders { proxy_pass http://order-service:3004; }
  location /v1/suppliers { proxy_pass http://supplier-service:3002; }
  location /v1/supplier-images/ { proxy_pass http://supplier-service:3002; }
  location /v1/ { proxy_pass http://user-service:3001; }

  # Everything else is the single-page app.
  location / { proxy_pass http://frontend:80; }
}
