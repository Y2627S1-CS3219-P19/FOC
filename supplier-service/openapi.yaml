openapi: 3.0.3
info:
  title: Supplier Service API
  version: 1.0.0
  description: |
    Supplier catalog and lifecycle management service for Friend on Campus (FoC).
    Provides catalog search, multi-attribute filtering, and real-time open status for students,
    as well as administrative endpoints for supplier management.
servers:
  - url: /v1
    description: v1 Base URL

paths:
  /suppliers:
    get:
      summary: List suppliers
      description: |
        Retrieves a paginated list of suppliers with optional multi-attribute
        filtering, keyword search, and sorting (F7).
        Requires a live, non-suspended Keycloak session.
        Regular users receive active suppliers only; admins can query deactivated stalls via status parameter.
      operationId: listSuppliers
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          description: Substring match against name, building, or location description (<= 100 chars).
          required: false
          schema:
            type: string
            maxLength: 100
            example: Cool
        - name: facilityType
          in: query
          description: One or more comma-separated facility types (e.g. Food,Food/Coffee).
          required: false
          schema:
            type: string
            example: Food,Food/Coffee
        - name: building
          in: query
          description: Exact campus building name, case-insensitive.
          required: false
          schema:
            type: string
            example: Com 2
        - name: status
          in: query
          description: |
            Filter by operating status.
            - `active` (default): active suppliers
            - `open_now`: suppliers currently open based on clock time
            - `inactive`: deactivated suppliers (Admin only)
            - `all`: all suppliers including deactivated (Admin only)
          required: false
          schema:
            type: string
            enum: [active, open_now, inactive, all]
            default: active
        - name: sort
          in: query
          description: Sort field.
          required: false
          schema:
            type: string
            enum: [name, location, facilityType]
            default: name
        - name: order
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: Page number (starts at 1).
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of records per page (max 50).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Successfully retrieved supplier catalog page.
          headers:
            X-Correlation-Id:
              schema:
                type: string
              description: Request correlation tracing identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

    post:
      summary: Create supplier
      description: |
        Registers a new supplier in the catalog (F8). Requires Admin role.
        Enforces supplier name uniqueness ignoring case.
      operationId: createSupplier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '201':
          description: Supplier successfully created.
          headers:
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Supplier name already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SUPPLIER_NAME_TAKEN
                  message: A supplier with this name already exists
                  details: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

    delete:
      summary: Bulk delete suppliers by facility type
      description: |
        Deletes all suppliers belonging to a specific facility type (F10.1.2). Requires Admin role.
        Requires `confirm=true` query parameter to execute.
      operationId: bulkDeleteSuppliers
      security:
        - BearerAuth: []
      parameters:
        - name: facilityType
          in: query
          description: Target facility type category to delete.
          required: true
          schema:
            type: string
            example: Laundry
        - name: confirm
          in: query
          description: Must be set to true to execute bulk deletion.
          required: true
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Bulk deletion executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - deleted
                      - facilityType
                    properties:
                      deleted:
                        type: integer
                        example: 2
                      facilityType:
                        type: string
                        example: Laundry
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /suppliers/filter-options:
    get:
      summary: Get available filter options
      description: |
        Returns distinct facility types and buildings currently available in the catalog.
        Admins also see values from deactivated suppliers.
      operationId: getFilterOptions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Distinct filter options list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - facilityTypes
                      - buildings
                    properties:
                      facilityTypes:
                        type: array
                        items:
                          type: string
                        example: ["Food", "Food/Coffee", "Printing", "Shopping"]
                      buildings:
                        type: array
                        items:
                          type: string
                        example: ["Central Library", "Com 2", "Prince George's Park"]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /suppliers/{id}:
    get:
      summary: Get supplier by ID
      description: |
        Retrieves full supplier details by UUID (F7.1).
        Deactivated suppliers return 404 for regular users, but are accessible to admins.
      operationId: getSupplierById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Supplier UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Supplier not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SUPPLIER_NOT_FOUND
                  message: Supplier not found
                  details: {}
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

    patch:
      summary: Update supplier
      description: |
        Partially updates supplier details (F9.3). Requires Admin role.
        At least one field must be supplied. Rejects unallowed fields with 422.
      operationId: updateSupplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Supplier UUID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequest'
      responses:
        '200':
          description: Supplier updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Supplier name already taken by another stall.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: SUPPLIER_NAME_TAKEN
                  message: A supplier with this name already exists
                  details: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

    delete:
      summary: Delete supplier
      description: |
        Permanently deletes a supplier record (F10.1.1). Requires Admin role.
      operationId: deleteSupplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Supplier UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Supplier deleted successfully.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /suppliers/{id}/deactivate:
    patch:
      summary: Deactivate supplier
      description: |
        Soft-deactivates an active supplier (F9.1).
        Preserves stall record and historical associations while hiding it from standard student catalog views.
        Requires Admin role.
      operationId: deactivateSupplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Supplier UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /suppliers/{id}/reactivate:
    patch:
      summary: Reactivate supplier
      description: |
        Reactivates a previously deactivated supplier (F9.2).
        Makes the stall publicly visible and active again. Requires Admin role.
      operationId: reactivateSupplier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: Supplier UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Supplier reactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSupplierResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /supplier-images/{file}:
    get:
      summary: Get supplier image
      description: |
        Public endpoint serving static store photos from `data/images/`.
        No authentication header required so `<img>` tags render natively in browsers.
      operationId: getSupplierImage
      parameters:
        - name: file
          in: path
          description: Image filename (e.g. `COOL_SPOT.jpeg`).
          required: true
          schema:
            type: string
            example: COOL_SPOT.jpeg
      responses:
        '200':
          description: Image JPEG binary stream.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: IMAGE_NOT_FOUND
                  message: The requested image does not exist
                  details: {}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak Bearer access token issued for `campuserrand-spa` (web app) or `campuserrand-test` (dev/testing).
        Verified locally against Keycloak's public keys (JWKS).
        Admin endpoints require `"admin"` in `realm_access.roles`.

  schemas:
    Supplier:
      type: object
      required:
        - id
        - name
        - facilityType
        - building
        - opensAt
        - closesAt
        - isActive
        - isOpenNow
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          maxLength: 100
          description: Unique supplier name across the platform.
          example: Cool Spot
        facilityType:
          type: string
          maxLength: 50
          description: Facility category (e.g. Food, Food/Coffee, Printing, Shopping).
          example: Food
        building:
          type: string
          maxLength: 100
          description: Campus building name.
          example: Com 2
        floor:
          type: string
          maxLength: 10
          nullable: true
          description: Floor level identifier.
          example: "1"
        locationDescription:
          type: string
          maxLength: 300
          nullable: true
          description: Walking instructions or landmark description.
          example: Opp LT16
        latitude:
          type: number
          format: double
          nullable: true
          description: GPS latitude coordinate.
          example: 1.2940156
        longitude:
          type: number
          format: double
          nullable: true
          description: GPS longitude coordinate.
          example: 103.7738478
        opensAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          description: Daily opening time in Singapore Time (24h HH:MM format).
          example: "09:00"
        closesAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          description: |
            Daily closing time in Singapore Time (24h HH:MM format).
            If closesAt < opensAt (e.g. 11:00 to 02:00), the stall spans past midnight.
          example: "21:30"
        isActive:
          type: boolean
          description: Admin master active/deactivated flag.
          example: true
        isOpenNow:
          type: boolean
          description: Real-time computed indicator evaluated against current Singapore time. Always false if isActive is false.
          example: true
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
          description: Relative path (/v1/supplier-images/file.jpeg) or S3 URL.
          example: /v1/supplier-images/COOL_SPOT.jpeg
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-22T00:15:00Z"

    CreateSupplierRequest:
      type: object
      required:
        - name
        - facilityType
        - building
        - opensAt
        - closesAt
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Supersnacks
        facilityType:
          type: string
          minLength: 1
          maxLength: 50
          example: Food
        building:
          type: string
          minLength: 1
          maxLength: 100
          example: Prince George's Park
        floor:
          type: string
          maxLength: 10
          nullable: true
          example: "1"
        locationDescription:
          type: string
          maxLength: 300
          nullable: true
          example: Block 10
        latitude:
          type: number
          format: double
          nullable: true
          example: 1.2913847
        longitude:
          type: number
          format: double
          nullable: true
          example: 103.7776367
        opensAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "11:00"
        closesAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
          example: "02:00"
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
          example: /v1/supplier-images/SUPERSNACKS.jpeg

    UpdateSupplierRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        facilityType:
          type: string
          minLength: 1
          maxLength: 50
        building:
          type: string
          minLength: 1
          maxLength: 100
        floor:
          type: string
          maxLength: 10
          nullable: true
        locationDescription:
          type: string
          maxLength: 300
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        opensAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        closesAt:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        imageUrl:
          type: string
          maxLength: 500
          nullable: true

    SingleSupplierResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Supplier'

    PaginatedSupplierResponse:
      type: object
      required:
        - data
        - page
        - limit
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 45

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid input
            details:
              type: object
              additionalProperties: true
              example:
                fieldErrors:
                  name: This field is required

  responses:
    UnauthorizedError:
      description: Missing, expired, or revoked authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            TokenMissing:
              value:
                error:
                  code: TOKEN_MISSING
                  message: Authorization Bearer token is required
                  details: {}
            TokenInvalid:
              value:
                error:
                  code: TOKEN_INVALID
                  message: Token signature or issuer is invalid
                  details: {}
            TokenExpired:
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: Access token has expired
                  details: {}
            SessionRevoked:
              value:
                error:
                  code: SESSION_REVOKED
                  message: User session was revoked or role changed
                  details: {}

    ForbiddenError:
      description: Access denied due to insufficient permissions or account suspension.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            InsufficientRole:
              value:
                error:
                  code: INSUFFICIENT_ROLE
                  message: Admin role required for this action
                  details:
                    requiredRoles: ["admin"]
            AccountSuspended:
              value:
                error:
                  code: ACCOUNT_SUSPENDED
                  message: Your account has been suspended
                  details:
                    reason: Repeated policy violations
                    adminContact: admin@foc.nus.edu
            AdminOnlyFilter:
              value:
                error:
                  code: ADMIN_ONLY_FILTER
                  message: Status filter 'inactive' or 'all' is reserved for administrators
                  details: {}

    NotFoundError:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SUPPLIER_NOT_FOUND
              message: Supplier not found
              details: {}

    ValidationError:
      description: Request payload or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid input
              details:
                fieldErrors:
                  tags: This field is not allowed.

    ServiceUnavailableError:
      description: Downstream authentication service (Keycloak / User Service) is unavailable (fails closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTH_SERVICE_UNAVAILABLE
              message: Unable to reach authentication service
              details: {}
